<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Règles - Theosusan-PKI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
    
    <header class="fixed-header">
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            <span class="navbar-brand mb-0 h5">Theosusan-PKI</span>
            <button id="logoutBtn" class="btn btn-danger btn-sm">Se déconnecter</button>
        </div>
    </header>
    
    <div class="d-flex" id="wrapper">
        
        <!-- Sidebar -->
        <div id="sidebar" class="border-end">
            <div class="list-group list-group-flush">
                <a href="dashboard" class="list-group-item list-group-item-action text-white">Dashboard</a>
                <a href="keys" class="list-group-item list-group-item-action text-white">Clés SSH</a>
                <a href="hosts" class="list-group-item list-group-item-action text-white">Hôtes</a>
                <a href="rules" class="list-group-item list-group-item-action text-white active">Règles</a>
            </div>
        </div>
        <!-- /#sidebar -->
        
        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 p-4">  
            <h2>Créer une règle</h2>
            
            <form id="ruleForm" class="mb-4">
                <div class="row g-3 align-items-end mb-3">
                    <div class="col-md-6">
                        <label for="hostSelect" class="form-label">Sélectionnez un hôte</label>
                        <select id="hostSelect" class="form-select" required>
                            <option value="" disabled selected>Choisir un hôte...</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" value="create" class="btn btn-primary mt-3 mt-md-0">Créer une règle</button>
                    </div>
                </div>
            </form>
            
            <h3>Liste des règles</h3>
            <table class="table table-striped table-dark table-bordered" id="rulesTable">
                <thead>
                    <tr>
                        <th>Hôte</th>
                        <th>Clés associées</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            
            <!-- Modal pour sélection des clés -->
            <div class="modal fade" id="keysModal" tabindex="-1" aria-labelledby="keysModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-scrollable">
                    <div class="modal-content">
                        <form id="keysForm">
                            <div class="modal-header">
                                <h5 class="modal-title" id="keysModalLabel"></h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                            </div>
                            <div class="modal-body">
                                <div id="keysEmptyState" class="alert alert-info d-none mb-0"></div>
                                <div id="keysTableWrapper" class="table-responsive">
                                    <table id="keysDataTable" class="table table-striped table-dark table-bordered align-middle w-100">
                                        <thead>
                                            <tr>
                                                <th>Choisir</th>
                                                <th>Nom</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                                <button type="submit" id="keysModalSubmitBtn" class="btn btn-primary"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>   
            
            <div class="position-fixed top-0 end-0 p-3 toast-region">
                <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <button type="button" class="btn-close toast-close-btn" data-bs-dismiss="toast" aria-label="Fermer"></button>
                    <div class="toast-body" id="toastBody">
                    </div>
                </div>
            </div>
            <!-- /#page-content-wrapper -->
            
        </div>
        <!-- /#wrapper -->
        
        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script
    src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    crossorigin="anonymous">
</script>
        <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
        <script src="/js/main.js"></script>
        
        <script>
            async function loadHosts() {
                try {
                    const [resHosts, resRules] = await Promise.all([
                        fetch('/rules/hosts'),
                        fetch('/rules/list')
                    ]);
                    if (!resHosts.ok) throw new Error('Erreur récupération hôtes');
                    if (!resRules.ok) throw new Error('Erreur récupération règles');
                    
                    const hosts = await resHosts.json();
                    const rules = await resRules.json();
                    const hostsWithRules = new Set(rules.map(rule => rule.host.id));
                    
                    const select = document.getElementById('hostSelect');
                    select.innerHTML = '';
                    
                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.disabled = true;
                    placeholder.selected = true;
                    placeholder.textContent = 'Choisir un hôte...';
                    select.appendChild(placeholder);
                    
                    const availableHosts = hosts.filter(host => !hostsWithRules.has(host.id));
                    
                    if (availableHosts.length === 0) {
                        const infoOption = document.createElement('option');
                        infoOption.value = '';
                        infoOption.disabled = true;
                        infoOption.textContent = 'Aucun hôte disponible';
                        select.appendChild(infoOption);
                        select.disabled = true;
                    } else {
                        select.disabled = false;
                        availableHosts.forEach(host => {
                            const option = document.createElement('option');
                            option.value = host.id;
                            option.textContent = host.hostname;
                            select.appendChild(option);
                        });
                    }
                } catch (err) {
                    showToast(err.message || 'Erreur lors du chargement des hôtes', false);
                    console.error(err);
                }
            }
            
            async function loadKeysAndRules() {
                const [resKeys, resRules] = await Promise.all([
                fetch('/rules/keys'),
                fetch('/rules/list')
                ]);
                if (!resKeys.ok) throw new Error('Erreur récupération clés');
                if (!resRules.ok) throw new Error('Erreur récupération règles');
                const keys = await resKeys.json();
                const rules = await resRules.json();
                return { keys, rules };
            }
            
            let keysDataTable = null;
            
            function destroyKeysDataTable() {
                if (keysDataTable) {
                    keysDataTable.destroy();
                    keysDataTable = null;
                }
            }
            
            function initKeysDataTable() {
                keysDataTable = $('#keysDataTable').DataTable({
                    autoWidth: false,
                    pageLength: 10,
                    lengthChange: false,
                    paging: true,
                    searching: true,
                    ordering: true,
                    info: true,
                    columnDefs: [
                        { targets: 0, orderable: false, searchable: false, width: '70px' }
                    ],
                    language: {
                        url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/fr-FR.json'
                    }
                });
            }
            
            function toggleKeysEmptyState(message) {
                const emptyState = document.getElementById('keysEmptyState');
                const tableWrapper = document.getElementById('keysTableWrapper');
                
                if (message) {
                    emptyState.textContent = message;
                    emptyState.classList.remove('d-none');
                    tableWrapper.classList.add('d-none');
                } else {
                    emptyState.textContent = '';
                    emptyState.classList.add('d-none');
                    tableWrapper.classList.remove('d-none');
                }
            }
            
            function fillKeysTable(keys, keysLinked = []) {
                destroyKeysDataTable();
                const tbody = document.querySelector('#keysDataTable tbody');
                tbody.innerHTML = '';
                
                keys.forEach(key => {
                    const isChecked = keysLinked.includes(key.id);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="key-select-cell">
                            <input class="form-check-input key-checkbox" type="checkbox" value="${key.id}" ${isChecked ? 'checked' : ''}>
                        </td>
                        <td class="text-truncate key-name-cell" title="${key.name}">
                            <span class="d-inline-block w-100">${key.name}</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                
                initKeysDataTable();
            }
            
            function setKeysFormState(mode, hostId, keysLinked = []) {
                const form = document.getElementById('keysForm');
                form.dataset.mode = mode;
                form.dataset.hostId = hostId;
                form.dataset.keysLinked = JSON.stringify(keysLinked);
            }
            
            async function openKeysModalForCreate(hostId) {
                try {
                    const { keys, rules } = await loadKeysAndRules();
                    
                    const keysAlreadyUsed = new Set();
                    rules.forEach(rule => {
                        if (rule.host.id === parseInt(hostId)) {
                            rule.keys.forEach(k => keysAlreadyUsed.add(k.id));
                        }
                    });
                    
                    const availableKeys = keys.filter(key => !keysAlreadyUsed.has(key.id));
                    
                    if (availableKeys.length === 0) {
                        toggleKeysEmptyState('Aucune clé disponible pour cet hôte.');
                        destroyKeysDataTable();
                    } else {
                        toggleKeysEmptyState('');
                        fillKeysTable(availableKeys);
                    }
                    
                    setKeysFormState('create', hostId);
                    
                    const keysModalEl = document.getElementById('keysModal');
                    const keysModal = new bootstrap.Modal(keysModalEl);
                    document.getElementById('keysModalSubmitBtn').textContent = 'Créer la règle';
                    document.getElementById('keysModalLabel').textContent = 'Création - Sélectionnez les clés SSH';
                    keysModal.show();
                    
                } catch (err) {
                    showToast(err.message || 'Erreur lors de la préparation des clés', false);
                    console.error(err);
                }
            }
            
            async function openKeysModalForEdit(hostId) {
                try {
                    const { keys, rules } = await loadKeysAndRules();
                    
                    const rule = rules.find(r => r.host.id === parseInt(hostId));
                    const keysLinked = rule ? rule.keys.map(k => k.id) : [];
                    
                    const sortedKeys = keys.slice().sort((a, b) => {
                        const aLinked = keysLinked.includes(a.id);
                        const bLinked = keysLinked.includes(b.id);
                        if (aLinked && !bLinked) return -1;
                        if (!aLinked && bLinked) return 1;
                        return a.name.localeCompare(b.name);
                    });
                    
                    toggleKeysEmptyState('');
                    fillKeysTable(sortedKeys, keysLinked);
                    
                    setKeysFormState('edit', hostId, keysLinked);
                    
                    const keysModalEl = document.getElementById('keysModal');
                    const keysModal = new bootstrap.Modal(keysModalEl);
                    document.getElementById('keysModalSubmitBtn').textContent = 'Valider';
                    document.getElementById('keysModalLabel').textContent = 'Edition - Sélectionnez les clés SSH';
                    keysModal.show();
                    
                } catch (err) {
                    showToast(err.message || 'Erreur lors du chargement des clés', false);
                    console.error(err);
                }
            }
            
            document.getElementById('ruleForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const form = e.target;
                const hostId = document.getElementById('hostSelect').value;
                
                if (!hostId) {
                    showToast('Veuillez sélectionner un hôte', false);
                    return;
                }
                
                openKeysModalForCreate(hostId);
            });
            
            document.getElementById('keysForm').addEventListener('submit', async e => {
                e.preventDefault();
                
                const form = e.currentTarget;
                const mode = form.dataset.mode;
                const hostId = form.dataset.hostId;
                const checkedBoxes = [...document.querySelectorAll('#keysDataTable input[type="checkbox"]:checked')];
                const selectedKeyIds = checkedBoxes.map(cb => parseInt(cb.value));
                
                if (selectedKeyIds.length === 0 && mode === 'create') {
                    showToast('Veuillez sélectionner au moins une clé', false);
                    return;
                }
                
                try {
                    if (mode === 'create') {
                        const res = await fetch('/rules/add', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ host_id: hostId, key_ids: selectedKeyIds })
                        });
                        if (!res.ok) {
                            const text = await res.text();
                            throw new Error(text || 'Erreur lors de la création des règles');
                        }
                        showToast('Règles créées avec succès !', true);
                    } else if (mode === 'edit') {
                        const keysLinked = JSON.parse(form.dataset.keysLinked || '[]');
                        const toAdd = selectedKeyIds.filter(id => !keysLinked.includes(id));
                        const toRemove = keysLinked.filter(id => !selectedKeyIds.includes(id));
                        
                        if (toAdd.length === 0 && toRemove.length === 0) {
                            showToast('Aucun changement détecté.', false);
                            const keysModalEl = document.getElementById('keysModal');
                            const keysModal = bootstrap.Modal.getInstance(keysModalEl);
                            keysModal.hide();
                            return;
                        }
                        
                        const changes = [
                        ...toAdd.map(id => ({ key_id: id, action: 'add' })),
                        ...toRemove.map(id => ({ key_id: id, action: 'delete' }))
                        ];
                        
                        const res = await fetch('/rules/edit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ host_id: hostId, changes: changes })
                        });
                        
                        if (!res.ok) {
                            const text = await res.text();
                            throw new Error(text || 'Erreur lors de la modification des règles');
                        }
                        
                        showToast('Règles modifiées avec succès !', true);
                    }
                    
                    const keysModalEl = document.getElementById('keysModal');
                    const keysModal = bootstrap.Modal.getInstance(keysModalEl);
                    keysModal.hide();
                    
                    document.getElementById('ruleForm').reset();
                    document.getElementById('keysForm').reset();
                    
                    await loadRules();
                    await loadHosts();
                    
                } catch (err) {
                    showToast(err.message || 'Erreur lors de la sauvegarde des règles', false);
                    console.error(err);
                }
            });
            
            async function loadRules() {
                try {
                    const res = await fetch('/rules/list');
                    if (!res.ok) throw new Error('Erreur récupération règles');
                    const rules = await res.json();
                    
                    const tbody = document.querySelector('#rulesTable tbody');
                    tbody.innerHTML = '';
                    
                    rules.forEach(rule => {
                        const tr = document.createElement('tr');
                        
                        const tdHost = document.createElement('td');
                        const hostBtn = document.createElement('button');
                        hostBtn.type = 'button';
                        hostBtn.className = 'btn btn-link text-white p-0 host-rule-link text-decoration-underline';
                        hostBtn.dataset.hostId = rule.host.id;
                        hostBtn.textContent = rule.host.hostname;
                        hostBtn.title = 'Modifier les règles de cet hôte';
                        tdHost.appendChild(hostBtn);
                        tr.appendChild(tdHost);
                        
                        const tdKeys = document.createElement('td');
                        tdKeys.textContent = rule.keys.map(k => k.name).join(', ');
                        tr.appendChild(tdKeys);
                        
                        const tdActions = document.createElement('td');
                        const btnDelete = document.createElement('button');
                        btnDelete.className = 'btn btn-danger btn-sm';
                        btnDelete.textContent = 'Supprimer';
                        btnDelete.setAttribute('data-host-id', rule.host.id);
                        tdActions.appendChild(btnDelete);
                        tr.appendChild(tdActions);
                        
                        tbody.appendChild(tr);
                    });
                    
                    document.querySelectorAll('#rulesTable button.btn-danger[data-host-id]').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const hostId = e.currentTarget.getAttribute('data-host-id');
                            if (!confirm('Voulez-vous vraiment supprimer cette règle ?')) return;
                            try {
                                const res = await fetch('/rules/delete', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ host_id: hostId })
                                });
                                if (!res.ok) throw new Error('Erreur suppression règle');
                                showToast('Règle supprimée', true);
                                document.getElementById('hostSelect').value = '';
                                await loadRules();
                                await loadHosts();
                            } catch (err) {
                                showToast(err.message || 'Erreur lors de la suppression', false);
                                console.error(err);
                            }
                        });
                    });
                    
                    document.querySelectorAll('.host-rule-link').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const hostId = e.currentTarget.getAttribute('data-host-id');
                            if (!hostId) return;
                            
                            try {
                                await openKeysModalForEdit(hostId);
                            } catch (err) {
                                console.error(err);
                            }
                        });
                    });
                    
                } catch (err) {
                    showToast(err.message || 'Erreur lors du chargement des règles', false);
                    console.error(err);
                }
            }
            
            // Initialisation
            loadHosts();
            loadRules();
            setupLogoutButton();
            
        </script>
        
    </body>
    </html>
