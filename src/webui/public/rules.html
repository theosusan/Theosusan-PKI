<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Règles - Theosusan-PKI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
    
    <header class="fixed-header">
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            <span class="navbar-brand mb-0 h5" style="color: #e0e0e0;">Theosusan-PKI</span>
            <button id="logoutBtn" class="btn btn-danger btn-sm">Se déconnecter</button>
        </div>
    </header>
    
    <div class="d-flex" id="wrapper">
        
        <!-- Sidebar -->
        <div id="sidebar" class="border-end">
            <div class="list-group list-group-flush">
                <a href="dashboard" class="list-group-item list-group-item-action text-white">Dashboard</a>
                <a href="keys" class="list-group-item list-group-item-action text-white">Clés SSH</a>
                <a href="hosts" class="list-group-item list-group-item-action text-white">Hôtes</a>
                <a href="rules" class="list-group-item list-group-item-action text-white active">Règles</a>
            </div>
        </div>
        <!-- /#sidebar -->
        
        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 p-4">  
            <h2>Créer une règle</h2>
            
            <form id="ruleForm" class="mb-4">
                <div class="mb-3">
                    <label for="hostSelect" class="form-label">Sélectionnez un hôte</label>
                    <select id="hostSelect" class="form-select" required>
                        <option value="" disabled selected>Choisir un hôte...</option>
                    </select>
                </div>
                
                <button type="submit" value="create" class="btn btn-primary">Créer une règle</button>
                <button type="submit" value="edit" class="btn btn-warning">Modifier</button>
            </form>
            
            <h3>Liste des règles</h3>
            <table class="table table-striped table-dark table-bordered" id="rulesTable">
                <thead>
                    <tr>
                        <th>Hôte</th>
                        <th>Clés associées</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            
            <!-- Modal pour sélection des clés -->
            <div class="modal fade" id="keysModal" tabindex="-1" aria-labelledby="keysModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-scrollable">
                    <div class="modal-content">
                        <form id="keysForm">
                            <div class="modal-header">
                                <h5 class="modal-title" id="keysModalLabel"></h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                            </div>
                            <div class="modal-body">
                                <div id="keysList" class="form-group">
                                    <!-- Les cases à cocher seront ajoutées ici dynamiquement -->
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                                <button type="submit" id="keysModalSubmitBtn" class="btn btn-primary"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>   
            
            <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080; margin-top: 56px; right: 1rem;">
                <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <button type="button" class="btn-close toast-close-btn" data-bs-dismiss="toast" aria-label="Fermer"></button>
                    <div class="toast-body" id="toastBody">
                    </div>
                </div>
            </div>
            <!-- /#page-content-wrapper -->
            
        </div>
        <!-- /#wrapper -->
        
        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/main.js"></script>
        
        <script>
            async function loadHosts() {
                try {
                    const res = await fetch('/rules/hosts');
                    if (!res.ok) throw new Error('Erreur récupération hôtes');
                    const hosts = await res.json();
                    const select = document.getElementById('hostSelect');
                    select.innerHTML = '<option value="" disabled selected>Choisir un hôte...</option>';
                    hosts.forEach(host => {
                        const option = document.createElement('option');
                        option.value = host.id;
                        option.textContent = host.hostname;
                        select.appendChild(option);
                    });
                } catch (err) {
                    alert('Erreur lors du chargement des hôtes');
                    console.error(err);
                }
            }
            
            async function loadKeysAndRules() {
                const [resKeys, resRules] = await Promise.all([
                fetch('/rules/keys'),
                fetch('/rules/list')
                ]);
                if (!resKeys.ok) throw new Error('Erreur récupération clés');
                if (!resRules.ok) throw new Error('Erreur récupération règles');
                const keys = await resKeys.json();
                const rules = await resRules.json();
                return { keys, rules };
            }
            
            async function openKeysModalForCreate(hostId) {
                try {
                    const { keys, rules } = await loadKeysAndRules();
                    
                    const keysAlreadyUsed = new Set();
                    rules.forEach(rule => {
                        if (rule.host.id === parseInt(hostId)) {
                            rule.keys.forEach(k => keysAlreadyUsed.add(k.id));
                        }
                    });
                    
                    const container = document.getElementById('keysList');
                    container.innerHTML = '';
                    
                    keys
                    .filter(key => !keysAlreadyUsed.has(key.id))
                    .forEach(key => {
                        const div = document.createElement('div');
                        div.className = 'form-check';
                        div.innerHTML = `
                                <input class="form-check-input" type="checkbox" value="${key.id}" id="key-${key.id}" name="key_ids">
                                <label class="form-check-label" for="key-${key.id}">
                                    ${key.name}
                                </label>
                            `;
                        container.appendChild(div);
                    });
                    
                    if (container.children.length === 0) {
                        container.innerHTML = '<p>Aucune clé disponible pour cet hôte.</p>';
                    }
                    
                    container.setAttribute('data-mode', 'create');
                    container.setAttribute('data-host-id', hostId);
                    
                    const keysModalEl = document.getElementById('keysModal');
                    const keysModal = new bootstrap.Modal(keysModalEl);
                    document.getElementById('keysModalSubmitBtn').textContent = 'Créer la règle';
                    document.getElementById('keysModalLabel').textContent = 'Création - Sélectionnez les clés SSH';
                    keysModal.show();
                    
                } catch (err) {
                    alert(err.message);
                    console.error(err);
                }
            }
            
            async function openKeysModalForEdit(hostId) {
                try {
                    const { keys, rules } = await loadKeysAndRules();
                    
                    const rule = rules.find(r => r.host.id === parseInt(hostId));
                    const keysLinked = rule ? rule.keys.map(k => k.id) : [];
                    
                    const container = document.getElementById('keysList');
                    container.innerHTML = '';
                    
                    const sortedKeys = keys.slice().sort((a, b) => {
                        const aLinked = keysLinked.includes(a.id);
                        const bLinked = keysLinked.includes(b.id);
                        if (aLinked && !bLinked) return -1;
                        if (!aLinked && bLinked) return 1;
                        return a.name.localeCompare(b.name);
                    });
                    
                    sortedKeys.forEach(key => {
                        const checked = keysLinked.includes(key.id) ? 'checked' : '';
                        const div = document.createElement('div');
                        div.className = 'form-check';
                        div.innerHTML = `
                            <input class="form-check-input" type="checkbox" value="${key.id}" id="key-${key.id}" name="key_ids" ${checked}>
                            <label class="form-check-label" for="key-${key.id}">
                                ${key.name}
                            </label>
                        `;
                        container.appendChild(div);
                    });
                    
                    container.setAttribute('data-mode', 'edit');
                    container.setAttribute('data-host-id', hostId);
                    container.setAttribute('data-keys-linked', JSON.stringify(keysLinked));
                    
                    const keysModalEl = document.getElementById('keysModal');
                    const keysModal = new bootstrap.Modal(keysModalEl);
                    document.getElementById('keysModalSubmitBtn').textContent = 'Valider';
                    document.getElementById('keysModalLabel').textContent = 'Edition - Sélectionnez les clés SSH';
                    keysModal.show();
                    
                } catch (err) {
                    alert(err.message);
                    console.error(err);
                }
            }
            
            document.getElementById('ruleForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const form = e.target;
                const submitter = e.submitter;
                const action = submitter.value;
                const hostId = document.getElementById('hostSelect').value;
                
                if (!hostId) {
                    alert('Veuillez sélectionner un hôte');
                    return;
                }
                
                if (action === 'create') {
                    openKeysModalForCreate(hostId);
                } else if (action === 'edit') {
                    openKeysModalForEdit(hostId);
                } else {
                    alert('Action inconnue.');
                }
            });
            
            document.getElementById('keysForm').addEventListener('submit', async e => {
                e.preventDefault();
                
                const container = document.getElementById('keysList');
                const mode = container.getAttribute('data-mode');
                const hostId = container.getAttribute('data-host-id');
                const checkedBoxes = [...container.querySelectorAll('input[type="checkbox"]:checked')];
                const selectedKeyIds = checkedBoxes.map(cb => parseInt(cb.value));
                
                if (selectedKeyIds.length === 0 && mode === 'create') {
                    alert('Veuillez sélectionner au moins une clé');
                    return;
                }
                
                try {
                    if (mode === 'create') {
                        const res = await fetch('/rules/add', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ host_id: hostId, key_ids: selectedKeyIds })
                        });
                        if (!res.ok) {
                            const text = await res.text();
                            throw new Error(text || 'Erreur lors de la création des règles');
                        }
                        alert('Règles créées avec succès !');
                    } else if (mode === 'edit') {
                        const keysLinked = JSON.parse(container.getAttribute('data-keys-linked') || '[]');
                        const toAdd = selectedKeyIds.filter(id => !keysLinked.includes(id));
                        const toRemove = keysLinked.filter(id => !selectedKeyIds.includes(id));
                        
                        if (toAdd.length === 0 && toRemove.length === 0) {
                            alert('Aucun changement détecté.');
                            const keysModalEl = document.getElementById('keysModal');
                            const keysModal = bootstrap.Modal.getInstance(keysModalEl);
                            keysModal.hide();
                            return;
                        }
                        
                        const changes = [
                        ...toAdd.map(id => ({ key_id: id, action: 'add' })),
                        ...toRemove.map(id => ({ key_id: id, action: 'delete' }))
                        ];
                        
                        const res = await fetch('/rules/edit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ host_id: hostId, changes: changes })
                        });
                        
                        if (!res.ok) {
                            const text = await res.text();
                            throw new Error(text || 'Erreur lors de la modification des règles');
                        }
                        
                        alert('Règles modifiées avec succès !');
                    }
                    
                    const keysModalEl = document.getElementById('keysModal');
                    const keysModal = bootstrap.Modal.getInstance(keysModalEl);
                    keysModal.hide();
                    
                    document.getElementById('ruleForm').reset();
                    document.getElementById('keysForm').reset();
                    
                    await loadRules();
                    
                } catch (err) {
                    alert(err.message);
                    console.error(err);
                }
            });
            
            async function loadRules() {
                try {
                    const res = await fetch('/rules/list');
                    if (!res.ok) throw new Error('Erreur récupération règles');
                    const rules = await res.json();
                    
                    const tbody = document.querySelector('#rulesTable tbody');
                    tbody.innerHTML = '';
                    
                    rules.forEach(rule => {
                        const tr = document.createElement('tr');
                        
                        const tdHost = document.createElement('td');
                        tdHost.textContent = rule.host.hostname;
                        tr.appendChild(tdHost);
                        
                        const tdKeys = document.createElement('td');
                        tdKeys.textContent = rule.keys.map(k => k.name).join(', ');
                        tr.appendChild(tdKeys);
                        
                        const tdActions = document.createElement('td');
                        const btnDelete = document.createElement('button');
                        btnDelete.className = 'btn btn-danger btn-sm';
                        btnDelete.textContent = 'Supprimer';
                        btnDelete.setAttribute('data-host-id', rule.host.id);
                        tdActions.appendChild(btnDelete);
                        tr.appendChild(tdActions);
                        
                        tbody.appendChild(tr);
                    });
                    
                    document.querySelectorAll('#rulesTable button[data-host-id]').forEach(button => {
                        button.addEventListener('click', async (e) => {
                            const hostId = e.currentTarget.getAttribute('data-host-id');
                            if (!confirm('Voulez-vous vraiment supprimer cette règle ?')) return;
                            try {
                                const res = await fetch('/rules/delete', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ host_id: hostId })
                                });
                                if (!res.ok) throw new Error('Erreur suppression règle');
                                alert('Règle supprimée');
                                document.getElementById('hostSelect').value = '';
                                document.querySelector('button[value="edit"]').disabled = true;
                                await loadRules();
                            } catch (err) {
                                alert(err.message);
                                console.error(err);
                            }
                        });
                    });
                    
                } catch (err) {
                    alert('Erreur lors du chargement des règles');
                    console.error(err);
                }
            }
            
            // Initialisation
            loadHosts();
            loadRules();
            setupLogoutButton();
            
            const hostSelect = document.getElementById('hostSelect');
            const editBtn = document.querySelector('button[value="edit"]');
            
            hostSelect.addEventListener('change', async () => {
                const selectedHostId = hostSelect.value;
                if (!selectedHostId) {
                    editBtn.disabled = true;
                    return;
                }
                
                try {
                    const res = await fetch('/rules/list');
                    if (!res.ok) throw new Error('Erreur récupération règles');
                    const rules = await res.json();
                    const hasRule = rules.some(rule => rule.host.id === parseInt(selectedHostId));
                    
                    editBtn.disabled = !hasRule;
                } catch (err) {
                    console.error(err);
                    // On désactive par sécurité
                    editBtn.disabled = true;
                }
            });
            
            // Au chargement de la page, désactiver le bouton Modifier par défaut
            editBtn.disabled = true;
            
        </script>
        
    </body>
    </html>
