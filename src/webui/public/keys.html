<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Clés SSH - Theosusan-PKI</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="/favicon.ico"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="/css/main.css"
  />

  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"
  />
</head>

<body>

  <header class="fixed-header">
    <div
      class="container-fluid d-flex justify-content-between align-items-center p-0"
    >
      <span
        class="navbar-brand mb-0 h5"
        style="color: #e0e0e0;"
      >
        Theosusan-PKI
      </span>

      <button
        id="logoutBtn"
        class="btn btn-danger btn-sm"
        type="button"
      >
        Se déconnecter
      </button>
    </div>
  </header>

  <div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div id="sidebar" class="border-end">
      <div class="list-group list-group-flush">

        <a
          href="dashboard"
          class="list-group-item list-group-item-action text-white"
        >
          Dashboard
        </a>

        <a
          href="keys"
          class="list-group-item list-group-item-action text-white active"
        >
          Clés SSH
        </a>

        <a
          href="hosts"
          class="list-group-item list-group-item-action text-white"
        >
          Hôtes
        </a>

        <a
          href="rules"
          class="list-group-item list-group-item-action text-white"
        >
          Règles
        </a>

      </div>
    </div>

    <div
      id="page-content-wrapper"
      class="w-100 p-4"
    >

      <h2 class="mb-4">
        Générer une nouvelle paire de clés SSH
      </h2>

      <form
        id="keyForm"
        class="mb-4"
      >
        <div class="row g-3">

          <div class="col-md-9">

            <label
              for="name"
              class="form-label"
            >
              Nom de la clé :
            </label>

            <input
              type="text"
              id="name"
              name="name"
              required
              class="form-control"
            />

          </div>

          <div class="col-md-3 d-flex align-items-end">

            <button
              type="submit"
              class="btn btn-primary w-100"
            >
              Générer la clé
            </button>

          </div>

        </div>
      </form>

      <h3>
        Liste des clés SSH
      </h3>

      <div
        id="keyDisplay"
        class="alert alert-secondary"
        style="display:none;"
      >

        <button
          id="closeKeyDisplay"
          type="button"
          class="btn-close"
          aria-label="Fermer"
        ></button>

        <div id="keyDisplayContent"></div>

      </div>

      <table
        id="keysTable"
        class="table table-dark table-striped table-bordered"
      ></table>

    </div>
  </div>

  <div
    class="position-fixed top-0 end-0 p-3"
    style="z-index: 1080; margin-top: 56px; right: 1rem;"
  >

    <div
      id="liveToast"
      class="toast"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >

      <button
        type="button"
        class="btn-close toast-close-btn"
        data-bs-dismiss="toast"
        aria-label="Fermer"
      ></button>

      <div
        class="toast-body"
        id="toastBody"
      ></div>

    </div>

  </div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- jQuery -->
  <script
    src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    crossorigin="anonymous"
  ></script>

  <!-- DataTables -->
  <script
    src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"
  ></script>

  <script
    src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"
  ></script>

  <!-- Application -->
  <script src="/js/main.js"></script>

  <script>

    let dataTable;

    /*
     * Génération d'une nouvelle clé
     */
    document
      .getElementById('keyForm')
      .addEventListener('submit', async (event) => {

        event.preventDefault();

        const nameInput =
          document.getElementById('name');

        const name =
          nameInput.value.trim();

        if (!name) {
          showToast(
            'Le nom de la clé est requis.',
            false
          );

          return;
        }

        try {

          const response =
            await fetch('/keys', {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                `name=${encodeURIComponent(name)}`
            });

          const text =
            await response.text();

          if (response.ok) {

            showToast(
              text ||
              'Clé générée avec succès !',
              true
            );

            nameInput.value = '';

            await fetchKeys();

          } else {

            showToast(
              text ||
              'Erreur lors de la génération.',
              false
            );

          }

        } catch (error) {

          console.error(error);

          showToast(
            'Erreur lors de la génération.',
            false
          );
        }
      });


    /*
     * Chargement des clés
     */
    async function fetchKeys() {

      try {

        const response =
          await fetch('/keys/list');

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const keys =
          await response.json();

        const rows =
          keys.map((key) => {

            /*
             * IMPORTANT :
             *
             * On ne met plus de données utilisateur
             * dans onclick="...".
             *
             * Seul l'id est placé dans data-key-id.
             */

            const privateButtons = `
              <div class="d-flex flex-wrap gap-2">

                <button
                  type="button"
                  class="btn btn-sm btn-info btn-show-private"
                  data-key-id="${encodeURIComponent(key.id)}"
                >
                  Afficher
                </button>

                <button
                  type="button"
                  class="btn btn-sm btn-success btn-download-private"
                  data-key-id="${encodeURIComponent(key.id)}"
                >
                  Télécharger
                </button>

              </div>
            `;

            const publicButton = `
              <button
                type="button"
                class="btn btn-sm btn-primary btn-show-public"
                data-key-id="${encodeURIComponent(key.id)}"
              >
                Afficher
              </button>
            `;

            const deleteButton = `
              <button
                type="button"
                class="btn btn-sm btn-danger btn-delete-key"
                data-key-id="${encodeURIComponent(key.id)}"
              >
                Supprimer
              </button>
            `;

            return [
              key.name,
              privateButtons,
              publicButton,
              deleteButton
            ];
          });

        dataTable
          .clear()
          .rows
          .add(rows)
          .draw();

      } catch (error) {

        console.error(
          'Erreur lors du chargement des clés :',
          error
        );

        showToast(
          'Erreur lors du chargement des clés.',
          false
        );
      }
    }


    /*
     * Récupération d'une clé par son ID
     *
     * On utilise /keys/list uniquement pour obtenir
     * le nom et la clé publique.
     */
    async function getKeyById(id) {

      const response =
        await fetch('/keys/list');

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      const keys =
        await response.json();

      return keys.find(
        (key) =>
          String(key.id) === String(id)
      );
    }


    /*
     * Affichage d'une clé privée
     */
    async function showPrivate(id) {

      try {

        const response =
          await fetch(
            `/keys/show-private/${encodeURIComponent(id)}`
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const privateKey =
          await response.text();

        const key =
          await getKeyById(id);

        if (!key) {
          throw new Error(
            'Clé introuvable'
          );
        }

        displayKey(
          privateKey,
          'Clé privée',
          key.name
        );

      } catch (error) {

        console.error(
          'Erreur affichage clé privée :',
          error
        );

        showToast(
          'Erreur lors du chargement de la clé privée.',
          false
        );
      }
    }


    /*
     * Affichage d'une clé publique
     */
    async function showPublic(id) {

      try {

        const key =
          await getKeyById(id);

        if (!key) {
          throw new Error(
            'Clé introuvable'
          );
        }

        displayKey(
          key.publicKey,
          'Clé publique',
          key.name
        );

      } catch (error) {

        console.error(
          'Erreur affichage clé publique :',
          error
        );

        showToast(
          'Erreur lors du chargement de la clé publique.',
          false
        );
      }
    }


    /*
     * Suppression d'une clé
     */
    async function deleteKey(id) {

      try {

        const key =
          await getKeyById(id);

        if (!key) {
          throw new Error(
            'Clé introuvable'
          );
        }

        const confirmed =
          window.confirm(
            `Supprimer la clé "${key.name}" ?`
          );

        if (!confirmed) {
          return;
        }

        const response =
          await fetch(
            `/keys/${encodeURIComponent(id)}`,
            {
              method: 'DELETE'
            }
          );

        const text =
          await response.text();

        if (response.ok) {

          showToast(
            text ||
            `Clé "${key.name}" supprimée avec succès.`,
            true
          );

          await fetchKeys();

        } else {

          showToast(
            `Erreur : ${text}`,
            false
          );
        }

      } catch (error) {

        console.error(
          'Erreur de suppression :',
          error
        );

        showToast(
          'Erreur de suppression.',
          false
        );
      }
    }


    /*
     * Gestion des boutons du tableau
     *
     * Pas de onclick inline.
     *
     * Le listener est placé sur le tableau lui-même.
     * Cela fonctionne également après un redraw de DataTables.
     */
    document
      .getElementById('keysTable')
      .addEventListener('click', async (event) => {

        const privateButton =
          event.target.closest(
            '.btn-show-private'
          );

        if (privateButton) {

          const id =
            decodeURIComponent(
              privateButton.dataset.keyId
            );

          await showPrivate(id);

          return;
        }


        const downloadButton =
          event.target.closest(
            '.btn-download-private'
          );

        if (downloadButton) {

          const id =
            decodeURIComponent(
              downloadButton.dataset.keyId
            );

          window.open(
            `/keys/download/${encodeURIComponent(id)}`,
            '_blank'
          );

          return;
        }


        const publicButton =
          event.target.closest(
            '.btn-show-public'
          );

        if (publicButton) {

          const id =
            decodeURIComponent(
              publicButton.dataset.keyId
            );

          await showPublic(id);

          return;
        }


        const deleteButton =
          event.target.closest(
            '.btn-delete-key'
          );

        if (deleteButton) {

          const id =
            decodeURIComponent(
              deleteButton.dataset.keyId
            );

          await deleteKey(id);
        }
      });


    /*
     * Initialisation DataTables
     */
    window.addEventListener(
      'load',
      async () => {

        dataTable =
          $('#keysTable').DataTable({

            pageLength: 10,

            lengthMenu: [
              10,
              25,
              50
            ],

            language: {

              decimal: ",",

              thousands: " ",

              lengthMenu:
                "Afficher _MENU_ entrées",

              zeroRecords:
                "Aucune donnée trouvée",

              info:
                "Affichage de _START_ à _END_ sur _TOTAL_ entrées",

              infoEmpty:
                "Aucune entrée à afficher",

              infoFiltered:
                "(filtré sur _MAX_ entrées au total)",

              search:
                "Rechercher :",

              paginate: {

                first:
                  "Premier",

                last:
                  "Dernier",

                next:
                  "Suivant",

                previous:
                  "Précédent"
              }
            },

            data: [],

            columns: [
              {
                title: "Nom"
              },
              {
                title: "Clé privée"
              },
              {
                title: "Clé publique"
              },
              {
                title: "Actions"
              }
            ]
          });

        await fetchKeys();
      }
    );


    setupCloseKeyDisplay();

    setupLogoutButton();

  </script>

</body>
</html>
