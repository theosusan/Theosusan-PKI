<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clés SSH - Theosusan-PKI</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
</head>

<body>
  <header class="fixed-header">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <span class="navbar-brand mb-0 h5" style="color: #e0e0e0;">Theosusan-PKI</span>
      <button id="logoutBtn" class="btn btn-danger btn-sm">Se déconnecter</button>
    </div>
  </header>
  
  <div class="d-flex" id="wrapper">
    
    <!-- Sidebar -->
    <div id="sidebar" class="border-end">
      <div class="list-group list-group-flush">
        <a href="dashboard" class="list-group-item list-group-item-action text-white">Dashboard</a>
        <a href="keys" class="list-group-item list-group-item-action text-white active">Clés SSH</a>
        <a href="hosts" class="list-group-item list-group-item-action text-white">Hôtes</a>
        <a href="rules" class="list-group-item list-group-item-action text-white">Règles</a>
      </div>
    </div>
    
    <div id="page-content-wrapper" class="w-100 p-4">
      <h2 class="mb-4">Générer une nouvelle paire de clés SSH</h2>
      <form id="keyForm" class="mb-4">
        <div class="row g-3">
          <div class="col-md-9">
            <label for="name" class="form-label">Nom de la clé :</label>
            <input type="text" id="name" name="name" required class="form-control" />
          </div>
          
          <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Générer la clé</button>
          </div>
        </div>
      </form>
      
      
      <h3>Liste des clés SSH</h3>
      <div id="keyDisplay" class="alert alert-secondary" style="display:none;">
        <button id="closeKeyDisplay" type="button" class="btn-close" aria-label="Fermer"></button>
        <div id="keyDisplayContent"></div>
      </div>
      
      
      <table id="keysTable" class="table table-dark table-striped table-bordered"></table>
    </div>
  </div>
  
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080; margin-top: 56px; right: 1rem;">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <button type="button" class="btn-close toast-close-btn" data-bs-dismiss="toast" aria-label="Fermer"></button>
      <div class="toast-body" id="toastBody">
      </div>
    </div>
    
    
    <!-- Bootstrap & DataTables JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <script src="/js/main.js"></script>
    
    <script>
      let dataTable;
      
      document.getElementById('keyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('name');
        const name = nameInput.value;
        
        try {
          const response = await fetch('/keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `name=${encodeURIComponent(name)}`,
          });
          
          const text = await response.text();
          
          if (response.ok) {
            showToast(text || 'Clé générée avec succès !', true);
            fetchKeys();
            nameInput.value = '';
          } else {
            showToast(text || 'Erreur lors de la génération.', false);
          }
        } catch (err) {
          console.error(err);
          showToast('Erreur lors de la génération.', false);
        }
      });
      
      async function fetchKeys() {
        try {
          const response = await fetch('/keys/list');
          if (!response.ok) throw new Error('Erreur chargement clés');
          const keys = await response.json();
          
          const rows = keys.map(key => {
            const btnGroup = `<div class="d-flex flex-wrap gap-2">
                              <button class="btn btn-sm btn-info" onclick="showPrivate('${key.id}', '${key.name.replace(/'/g, "\\'")}')">Afficher</button>
                              <button class="btn btn-sm btn-success" onclick="window.open('/keys/download/${key.id}', '_blank')">Télécharger</button>
                              </div>`;
            const btnShowPublic = `<button class="btn btn-sm btn-primary" onclick="showPublic(\`${key.publicKey}\`, '${key.name.replace(/'/g, "\\'")}')">Afficher</button>`;
            const btnDelete = `<button class="btn btn-sm btn-danger" onclick="deleteKey('${key.id}', '${key.name}')">Supprimer</button>`;
            
            
            return [key.name, btnGroup, btnShowPublic, btnDelete];
          });
          
          dataTable.clear().rows.add(rows).draw();
        } catch (err) {
          console.error(err);
        }
      }
      
      async function showPrivate(id, keyName) {
        try {
          const res = await fetch(`/keys/show-private/${id}`);
          if (!res.ok) throw new Error();
          const privateKey = await res.text();
          displayKey(privateKey, 'Clé privée', keyName);
        } catch {
          showToast("Erreur lors du chargement de la clé privée.", false);
        }
      }
      
      function showPublic(publicKey, keyName) {
        displayKey(publicKey, 'Clé publique', keyName);
      }
      
      async function deleteKey(id, name) {
        if (!confirm(`Supprimer la clé "${name}" ?`)) return;
        
        try {
          const res = await fetch(`/keys/${id}`, { method: 'DELETE' });
          const text = await res.text();
          
          if (res.ok) {
            showToast(text || `Clé "${name}" supprimée avec succès.`, true);
            fetchKeys();
          } else {
            showToast(`Erreur : ${text}`, false);
          }
        } catch (err) {
          console.error(err);
          showToast("Erreur de suppression.", false);
        }
      }
      
      window.addEventListener('load', async () => {
        dataTable = $('#keysTable').DataTable({
          pageLength: 10,
          lengthMenu: [10, 25, 50],
          language: {
            decimal: ",",
            thousands: " ",
            lengthMenu: "Afficher _MENU_ entrées",
            zeroRecords: "Aucune donnée trouvée",
            info: "Affichage de _START_ à _END_ sur _TOTAL_ entrées",
            infoEmpty: "Aucune entrée à afficher",
            infoFiltered: "(filtré sur _MAX_ entrées au total)",
            search: "Rechercher :",
            paginate: {
              first: "Premier",
              last: "Dernier",
              next: "Suivant",
              previous: "Précédent"
            }
          },
          data: [],
          columns: [
          { title: "Nom" },
          { title: "Clé privée" },
          { title: "Clé publique" },
          { title: "Actions" }
          ]
        });
        
        await fetchKeys();
      });
      
      setupCloseKeyDisplay(); //Bouton X pour fermer l'affichage des clés
      setupLogoutButton(); // Bouton déconnection
    </script>
    
  </body>
  </html>
